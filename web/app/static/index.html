<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CardHannis · 工作区布局 Demo</title>
<link rel="stylesheet" href="/static/style.css" />
<style>
  .demo-banner { display:flex;align-items:center;gap:10px;margin-top:18px;padding:10px 14px;border:1px dashed #cfd9cd;border-radius:10px;color:#7c8980;background:rgba(229,238,232,.45);font-size:11.5px; }
  .demo-banner b { color:#4e836b; }
  .demo-banner a { margin-left:auto;color:#4e836b;font-weight:700;font-size:11px; }

  /* ===== 工作区横向排列 ===== */
  .workspace-rail { display:flex;align-items:stretch;gap:12px;margin-top:30px;overflow-x:auto;padding-bottom:4px; }
  .workspace-tab { position:relative;display:grid;gap:4px;min-width:150px;padding:15px 34px 15px 16px;border:1px solid #e3ddd1;border-radius:14px;background:rgba(255,255,255,.55);text-align:left;transition:.16s; }
  .workspace-tab:hover { border-color:#c9d6cb;transform:translateY(-1px);box-shadow:0 8px 22px rgba(62,78,68,.07); }
  .workspace-tab.active { color:#f2f6f1;border-color:#31574a;background:linear-gradient(135deg,#3c6857,#2c5043);box-shadow:0 10px 26px rgba(49,92,78,.24); }
  .workspace-tab .ws-eyebrow { font-family:ui-monospace,Menlo,monospace;font-size:9px;letter-spacing:.14em;color:#a5a49a; }
  .workspace-tab.active .ws-eyebrow { color:#9db8a8; }
  .workspace-tab .ws-name { font-size:15px;font-weight:750;letter-spacing:-.02em; }
  .workspace-tab .ws-count { font-size:10.5px;color:#8b938a; } .workspace-tab.active .ws-count { color:#b7ccc0; }
  .ws-close { position:absolute;top:9px;right:9px;display:none;width:19px;height:19px;border:0;border-radius:6px;color:#b7bdb3;background:transparent;font-size:12px;line-height:1; }
  .workspace-tab:hover .ws-close { display:block; } .ws-close:hover { color:#b96c5e;background:rgba(185,108,94,.14); }
  .workspace-tab.active .ws-close { color:#a9c3b4; } .workspace-tab.active:hover .ws-close { color:#f0c9bf;background:rgba(185,108,94,.25); }
  .ws-add { display:grid;place-items:center;min-width:52px;border:1px dashed #cfd6cc;border-radius:14px;color:#79a18a;background:transparent;font-size:19px;transition:.16s; }
  .ws-add:hover { color:#2f6654;border-color:#9dbfa9;background:#eef3ec; }

  /* ===== 竖向可收起分级面板 ===== */
  .group-stack { display:grid;gap:13px;margin-top:26px; }
  .group-panel { border:1px solid #e7e1d7;border-radius:15px;background:rgba(255,255,255,.5);overflow:hidden;transition:border-color .16s; }
  .group-panel.open { border-color:#dcdfd3;background:rgba(255,255,255,.62); }
  .group-head { display:flex;align-items:stretch; }
  .group-toggle { flex:1;min-width:0;display:flex;align-items:center;gap:11px;padding:15px 6px 15px 17px;border:0;background:transparent;text-align:left; }
  .group-toggle:hover { background:rgba(229,238,232,.4); }
  .group-chevron { display:grid;place-items:center;width:22px;height:22px;border-radius:7px;color:#5f8574;background:#e9efe6;font-size:10px;transition:transform .22s ease; }
  .group-panel:not(.open) .group-chevron { transform:rotate(-90deg); }
  .group-title { font-size:14px;font-weight:750;letter-spacing:-.02em; }
  .group-desc { color:#a6aba2;font-size:10.5px; }
  .group-count { padding:3px 8px;border-radius:20px;color:#7d8a80;background:#eef0ea;font-size:10.5px;font-weight:700; }
  .group-hint { margin-left:auto;color:#b3b6ae;font-size:10.5px;font-family:ui-monospace,Menlo,monospace;letter-spacing:.05em;white-space:nowrap; }
  .group-accent { flex:none;width:8px;height:8px;border-radius:50%; }
  .head-tools { display:flex;align-items:center;gap:3px;padding-right:12px; }
  .head-btn { display:grid;place-items:center;width:26px;height:26px;border:1px solid transparent;border-radius:8px;color:#8b968d;background:transparent;font-size:12.5px;transition:.14s; }
  .head-btn:hover { color:#2f6654;border-color:#d5e0d4;background:rgba(229,238,232,.65); }
  .head-btn.add:hover { color:#3d735e;border-color:#c5dcc8;background:#e5f0e7; }
  .head-btn.danger:hover { color:#b96c5e;border-color:#e8cdc5;background:#f9e8e4; }
  .group-body { display:grid;grid-template-rows:0fr;transition:grid-template-rows .26s ease; }
  .group-panel.open .group-body { grid-template-rows:1fr; }
  .group-inner { overflow:hidden;min-height:0; }
  .group-tasks { display:grid;gap:10px;padding:2px 17px 17px; }
  .group-empty { padding:2px 17px 18px;color:#b0b3ad;font-size:11.5px; }

  /* ===== 条目 ===== */
  .task-row { align-items:center; }
  .priority-chip { flex:0 0 auto;display:grid;place-items:center;min-width:37px;height:29px;padding:0 7px;border:1px solid;border-radius:9px;font-family:ui-monospace,Menlo,monospace;font-size:11px;font-weight:750;transition:.16s; }
  .priority-chip:hover { filter:brightness(.94);transform:translateY(-1px); }
  .task-row.done .task-main h3 { text-decoration:line-through;color:#9aa29b; }
  .status-pill.waiting { color:#5c7699;background:#e9eff7; }
  .act-button { display:inline-flex;align-items:center;gap:5px;height:27px;border:0;border-radius:7px;padding:0 9px;color:#819189;background:transparent;font-size:11px;font-weight:650;white-space:nowrap; }
  .act-button:hover { color:#2f6654;background:#e8efe9; }
  .act-button.done-act:hover { color:#3d735e;background:#e5f0e7; }
  .act-button.danger:hover { color:#b96c5e;background:#f9e8e4; }

  .workspace-strip { display:flex;align-items:center;justify-content:space-between;margin-top:34px; }
  .workspace-strip h2 { margin-top:4px; }
  .demo-foot { margin-top:46px;color:#b0b3ad;font-size:10.5px;font-family:ui-monospace,Menlo,monospace;letter-spacing:.05em; }
</style>
</head>
<body>
<main class="shell" style="grid-template-columns:1fr;">
  <section class="content" style="width:min(980px,100%);">
    <header class="topbar">
      <div><div class="eyebrow" id="today"></div><h1>工作区</h1></div>
      <div class="topbar-actions"><button class="avatar" type="button" aria-label="用户">H</button></div>
    </header>
    <div class="demo-banner">🧪 <span><b>布局 Demo v5</b> · 分级可增删改名；新任务入口在每个分级旁；解除阻塞 → 等待中；mock 数据存于浏览器本地，尚未接后端。</span><a href="#" id="reset-link">重置演示数据</a></div>

    <nav class="workspace-rail" id="workspace-rail" aria-label="工作区"></nav>

    <div class="workspace-strip">
      <div><span class="eyebrow">PRIORITIES</span><h2 id="ws-heading">日常</h2></div>
      <div style="display:flex;gap:8px;align-items:center;">
        <button class="secondary-button" id="toggle-all" type="button">全部收起</button>
        <button class="primary-button" id="add-prio" type="button">＋ 添加分级</button>
      </div>
    </div>

    <section class="group-stack" id="group-stack"></section>
    <div class="demo-foot">CARDHANNIS WORKSPACE DEMO · V5 · 2026-09-02</div>
  </section>
</main>
<div id="toast" class="toast" role="status"></div>
<dialog id="task-dialog">
  <form method="dialog" id="task-form" class="dialog-card">
    <button class="dialog-close" value="cancel" aria-label="关闭" type="button">×</button>
    <span class="eyebrow">NEW TASK</span><h2>新任务</h2>
    <label>标题<input name="title" required maxlength="120" placeholder="想做什么？" autofocus /></label>
    <label>预计投入（小时，可选）<input name="hours" type="number" min="0" step="0.5" placeholder="例如 2" /></label>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      <label>分级<select name="priority" id="prio-select"></select></label>
      <label>工作区<select name="workspace" id="ws-select"></select></label>
    </div>
    <div class="dialog-actions"><button class="secondary-button" value="cancel" type="submit">取消</button><button class="primary-button" value="default" type="submit">添加</button></div>
  </form>
</dialog>
<dialog id="block-dialog">
  <form method="dialog" id="block-form" class="dialog-card">
    <button class="dialog-close" value="cancel" aria-label="关闭" type="button">×</button>
    <span class="eyebrow">BLOCK TASK</span><h2>标记阻塞</h2>
    <p class="block-task-hint" id="block-task-title"></p>
    <label>阻塞原因<textarea name="reason" rows="2" required maxlength="300" placeholder="例如：等待接口文档"></textarea></label>
    <div class="dialog-actions"><button class="secondary-button" value="cancel" type="submit">取消</button><button class="primary-button" value="default" type="submit">确认阻塞</button></div>
  </form>
</dialog>
<script>
const LS_KEY = "cardhannis.workspace-demo.v5";
const PRIO_PALETTE = ["#5c7699", "#7a5ea6", "#3d735e", "#a0632f", "#8a5a7a", "#4e7d8a"];
const STATUSES = {
  in_progress: { label: "进行中", cls: "in_progress" },
  blocked:     { label: "阻塞中", cls: "blocked" },
  pending:     { label: "待处理", cls: "pending" },
  waiting:     { label: "等待中", cls: "waiting" },
  completed:   { label: "已完成", cls: "completed" },
};
const STATUS_ORDER = { in_progress: 0, blocked: 1, pending: 2, waiting: 3, completed: 4 };
const now = () => new Date().toISOString();

function seed() {
  const t = (id, ws, prio, title, status, extra = {}) => ({ id, ws, priority: prio, title, status, hours: null, reason: null, updated: now(), ...extra });
  return {
    workspaces: [
      { id: "daily", name: "日常", builtin: true },
      { id: "work",  name: "工作", builtin: true },
    ],
    collapsed: { daily: {}, work: {} },
    activeWs: "daily",
    prios: [
      { key: "P0", label: "P0", desc: "关键 · 必须尽快", color: "#b0432f" },
      { key: "P1", label: "P1", desc: "重要 · 本周推进", color: "#b16d42" },
      { key: "P2", label: "P2", desc: "一般 · 有空再做", color: "#8f9a90" },
    ],
    tasks: [
      t("d1","daily","P0","预约牙科洁牙","blocked",{reason:"诊所周末号源约满，等放号"}),
      t("d2","daily","P0","给妈妈准备生日礼物","pending",{hours:1}),
      t("d3","daily","P1","晨间复盘 + 规划今日三件事","in_progress",{hours:.5}),
      t("d4","daily","P2","整理书桌与相机器材","pending"),
      t("d5","daily","P2","读完《置身事内》最后两章","completed",{hours:3}),
      t("w1","work","P0","API 网关超时配置升级","blocked",{reason:"依赖平台组发布窗口"}),
      t("w2","work","P0","CardHannis：WebUI 工作区改版","in_progress",{hours:4}),
      t("w3","work","P1","周会材料：Q3 里程碑对齐","pending",{hours:2}),
      t("w4","work","P1","评审同事的同步模块 PR","pending"),
      t("w5","work","P2","报销 8 月差旅","completed"),
    ],
  };
}
function load() { try { const raw = localStorage.getItem(LS_KEY); if (raw) { const v = JSON.parse(raw); if (v.prios && v.workspaces && v.tasks) return v; } } catch {} return seed(); }
function save() { localStorage.setItem(LS_KEY, JSON.stringify(state)); }
let state = load();

const $ = (id) => document.getElementById(id);
const escapeHtml = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
function fmtTime(iso) { const d = new Date(iso); return `${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; }
function notify(msg) { const el = $("toast"); el.textContent = msg; el.classList.add("show"); clearTimeout(notify._t); notify._t = setTimeout(() => el.classList.remove("show"), 1900); }
const wsById = (id) => state.workspaces.find((w) => w.id === id);
const prioOf = (key) => state.prios.find((p) => p.key === key) || state.prios[0];
const chipStyle = (p) => `color:${p.color};border-color:${p.color}55;background:${p.color}14`;

function renderRail() {
  $("workspace-rail").innerHTML = state.workspaces.map((ws) => {
    const tasks = state.tasks.filter((t) => t.ws === ws.id);
    const open = tasks.filter((t) => t.status !== "completed").length;
    const blocked = tasks.filter((t) => t.status === "blocked").length;
    const waiting = tasks.filter((t) => t.status === "waiting").length;
    return `<button class="workspace-tab ${ws.id === state.activeWs ? "active" : ""}" data-ws="${ws.id}" type="button">
      <span class="ws-eyebrow">WORKSPACE</span>
      <span class="ws-name">${escapeHtml(ws.name)}</span>
      <span class="ws-count">${open} 项未完成${blocked ? ` · ${blocked} 阻塞` : ""}${waiting ? ` · ${waiting} 等待` : ""}</span>
      ${ws.builtin ? "" : `<span class="ws-close" data-del="${ws.id}" title="删除工作区">×</span>`}
    </button>`;
  }).join("") + `<button class="ws-add" id="ws-add" type="button" title="新建工作区">＋</button>`;
}

function renderGroups() {
  const ws = wsById(state.activeWs);
  $("ws-heading").textContent = ws ? ws.name : "";
  const collapsedAll = state.prios.every((g) => state.collapsed[state.activeWs]?.[g.key]);
  $("toggle-all").textContent = collapsedAll ? "全部展开" : "全部收起";
  $("group-stack").innerHTML = state.prios.map((g) => {
    const tasks = state.tasks.filter((t) => t.ws === state.activeWs && t.priority === g.key)
      .sort((a, b) => STATUS_ORDER[a.status] - STATUS_ORDER[b.status]);
    const open = !(state.collapsed[state.activeWs] || {})[g.key];
    const blocked = tasks.filter((t) => t.status === "blocked").length;
    const waiting = tasks.filter((t) => t.status === "waiting").length;
    const hints = []; if (blocked) hints.push(`⏸ ${blocked}`); if (waiting) hints.push(`💤 ${waiting}`);
    return `<section class="group-panel ${open ? "open" : ""}" data-group="${g.key}">
      <div class="group-head">
        <button class="group-toggle" type="button" data-toggle="${g.key}" aria-expanded="${open}">
          <span class="group-accent" style="background:${g.color}"></span>
          <span class="group-chevron">▼</span>
          <span class="group-title">${escapeHtml(g.label)}</span>
          ${g.desc ? `<span class="group-desc">${escapeHtml(g.desc)}</span>` : ""}
          <span class="group-count">${tasks.length}</span>
          <span class="group-hint">${open ? hints.join(" ") : "已收起"}</span>
        </button>
        <div class="head-tools">
          <button class="head-btn add" data-gact="grp-add" data-prio="${g.key}" title="在「${escapeHtml(g.label)}」新任务" type="button">＋</button>
          <button class="head-btn" data-gact="grp-rename" data-prio="${g.key}" title="重命名分级" type="button">✎</button>
          <button class="head-btn danger" data-gact="grp-del" data-prio="${g.key}" title="删除分级（仅限空分级）" type="button">✕</button>
        </div>
      </div>
      <div class="group-body"><div class="group-inner">
        ${tasks.length ? `<div class="group-tasks">${tasks.map((t) => card(t)).join("")}</div>` : `<div class="group-empty">该分级暂无任务。</div>`}
      </div></div>
    </section>`;
  }).join("");
}

function card(task) {
  const st = STATUSES[task.status];
  const prio = prioOf(task.priority);
  const blocked = task.status === "blocked";
  return `<article class="task-card task-row ${task.status === "completed" ? "done" : ""} ${blocked ? "blocked" : ""}">
    <button class="priority-chip" style="${chipStyle(prio)}" data-act="cycle" data-id="${task.id}" title="点击轮换分级" type="button">${escapeHtml(prio.label)}</button>
    <div class="task-main">
      <div class="task-title-row"><h3>${escapeHtml(task.title)}</h3><span class="status-pill ${st.cls}">${st.label}</span></div>
      ${blocked && task.reason ? `<p>⏸ ${escapeHtml(task.reason)}</p>` : ""}
      ${task.status === "waiting" ? `<p class="waiting-note">💤 等待中 · 未到开工时机</p>` : ""}
      <div class="task-meta"><span>${task.hours ? `≈ ${task.hours}h` : "未估时"}</span><span>更新 ${fmtTime(task.updated)}</span></div>
    </div>
    <div class="task-actions">
      ${task.status === "pending" || task.status === "waiting" ? `<button class="act-button" data-act="start" data-id="${task.id}" type="button">▶ 开始</button>` : ""}
      ${task.status === "waiting" ? `<button class="act-button" data-act="unwait" data-id="${task.id}" type="button">↩ 待处理</button>` : ""}
      ${task.status === "in_progress" ? `<button class="act-button" data-act="pause" data-id="${task.id}" type="button">⏯ 暂停</button>` : ""}
      ${task.status !== "completed" && !blocked ? `<button class="act-button" data-act="block" data-id="${task.id}" type="button">⏸ 阻塞</button>` : ""}
      ${blocked ? `<button class="act-button" data-act="unblock" data-id="${task.id}" title="解除阻塞，进入等待中" type="button">▶ 解除阻塞</button>` : ""}
      ${task.status !== "completed" ? `<button class="act-button done-act" data-act="toggle-done" data-id="${task.id}" type="button">✓ 完成</button>` : `<button class="act-button" data-act="toggle-done" data-id="${task.id}" type="button">↺ 重新打开</button>`}
      <button class="act-button danger" data-act="delete" data-id="${task.id}" title="删除任务" type="button">⌫</button>
    </div>
  </article>`;
}

function render() { renderRail(); renderGroups(); }

/* ===== 工作区交互 ===== */
$("today").textContent = new Date().toLocaleDateString("zh-CN", { year: "numeric", month: "long", day: "numeric", weekday: "long" });
$("workspace-rail").addEventListener("click", (e) => {
  const del = e.target.closest("[data-del]");
  if (del) {
    const id = del.dataset.del; const ws = wsById(id);
    const count = state.tasks.filter((t) => t.ws === id).length;
    if (!confirm(`删除工作区「${ws.name}」？其中 ${count} 个任务将一并移除。`)) return;
    state.workspaces = state.workspaces.filter((w) => w.id !== id);
    state.tasks = state.tasks.filter((t) => t.ws !== id);
    delete state.collapsed[id];
    if (state.activeWs === id) state.activeWs = state.workspaces[0]?.id;
    save(); render(); notify("工作区已删除"); return;
  }
  if (e.target.closest("#ws-add")) {
    const name = prompt("新工作区名称（如：学习 / 项目A）");
    const trimmed = name && name.trim(); if (!trimmed) return;
    const id = "ws-" + Date.now().toString(36);
    state.workspaces.push({ id, name: trimmed }); state.collapsed[id] = {}; state.activeWs = id;
    save(); render(); notify(`已创建工作区「${trimmed}」`); return;
  }
  const tab = e.target.closest(".workspace-tab");
  if (tab) { state.activeWs = tab.dataset.ws; save(); render(); }
});

/* ===== 分级管理：添加 / 重命名 / 删除 / 组头新任务 ===== */
$("add-prio").addEventListener("click", () => {
  const name = prompt("新分级名称（如：P3 / 紧急 / 长期）");
  const label = name && name.trim(); if (!label) return;
  const key = "G" + Date.now().toString(36);
  state.prios.push({ key, label, desc: "", color: PRIO_PALETTE[state.prios.length % PRIO_PALETTE.length] });
  state.collapsed[state.activeWs] = state.collapsed[state.activeWs] || {};
  save(); render(); notify(`已添加分级「${label}」`);
});

$("group-stack").addEventListener("click", (e) => {
  const gbtn = e.target.closest("[data-gact]");
  if (gbtn) {
    const g = prioOf(gbtn.dataset.prio);
    if (gbtn.dataset.gact === "grp-add") { openTaskDialog(g.key); return; }
    if (gbtn.dataset.gact === "grp-rename") {
      const name = prompt("重命名分级", g.label);
      const label = name && name.trim(); if (!label) return;
      g.label = label; save(); render(); notify("分级已重命名"); return;
    }
    if (gbtn.dataset.gact === "grp-del") {
      if (state.prios.length <= 1) { notify("至少要保留一个分级"); return; }
      const inUse = state.tasks.filter((t) => t.priority === g.key);
      if (inUse.length) { notify(`「${g.label}」还有 ${inUse.length} 个任务，先移走再删除`); return; }
      if (!confirm(`删除空分级「${g.label}」？`)) return;
      state.prios = state.prios.filter((p) => p.key !== g.key);
      Object.values(state.collapsed).forEach((c) => { delete c[g.key]; });
      save(); render(); notify("分级已删除"); return;
    }
  }
  const head = e.target.closest("[data-toggle]");
  if (head) {
    const g = head.dataset.toggle;
    state.collapsed[state.activeWs] = state.collapsed[state.activeWs] || {};
    state.collapsed[state.activeWs][g] = !state.collapsed[state.activeWs][g];
    save(); renderGroups(); return;
  }
  const btn = e.target.closest("[data-act]"); if (!btn) return;
  const task = state.tasks.find((t) => t.id === btn.dataset.id); if (!task) return;
  switch (btn.dataset.act) {
    case "cycle": {
      const i = state.prios.findIndex((p) => p.key === task.priority);
      task.priority = state.prios[(i + 1) % state.prios.length].key;
      state.collapsed[state.activeWs][task.priority] = false;
      notify(`已移到「${prioOf(task.priority).label}」`); break;
    }
    case "toggle-done": task.status = task.status === "completed" ? "pending" : "completed"; break;
    case "start": task.status = "in_progress"; break;
    case "pause": task.status = "pending"; break;
    case "unwait": task.status = "pending"; break;
    case "unblock": task.status = "waiting"; task.reason = null; break;
    case "delete": state.tasks = state.tasks.filter((t) => t.id !== task.id); break;
    case "block": openBlock(task.id); return;
  }
  task.updated = now(); save(); render();
});

$("toggle-all").addEventListener("click", () => {
  const c = state.collapsed[state.activeWs] = state.collapsed[state.activeWs] || {};
  const anyOpen = state.prios.some((g) => !c[g.key]);
  state.prios.forEach((g) => { c[g.key] = anyOpen; });
  save(); renderGroups();
});

/* ===== 任务 / 阻塞对话框 ===== */
let blockingId = null;
function openBlock(id) {
  const task = state.tasks.find((t) => t.id === id); if (!task) return;
  blockingId = id; $("block-task-title").textContent = task.title;
  $("block-form").reason.value = ""; $("block-dialog").showModal();
}
$("block-form").addEventListener("submit", (e) => {
  if (e.submitter && e.submitter.value === "cancel") return;
  const reason = $("block-form").reason.value.trim(); if (!reason || !blockingId) return;
  const task = state.tasks.find((t) => t.id === blockingId);
  task.status = "blocked"; task.reason = reason; task.updated = now();
  blockingId = null; save(); render(); notify("已标记阻塞");
});

function openTaskDialog(prioKey) {
  $("task-form").reset();
  $("prio-select").innerHTML = state.prios.map((p) => `<option value="${p.key}" ${p.key === (prioKey || "") ? "selected" : ""}>${escapeHtml(p.label)}</option>`).join("");
  $("ws-select").innerHTML = state.workspaces.map((w) => `<option value="${w.id}" ${w.id === state.activeWs ? "selected" : ""}>${escapeHtml(w.name)}</option>`).join("");
  $("task-dialog").showModal();
}
$("task-form").addEventListener("submit", (e) => {
  if (e.submitter && e.submitter.value === "cancel") return;
  const f = $("task-form"); const title = f.title.value.trim(); if (!title) return;
  state.tasks.unshift({ id: "t" + Date.now().toString(36), ws: f.workspace.value, priority: f.priority.value, title, status: "pending", hours: f.hours.value ? Number(f.hours.value) : null, reason: null, updated: now() });
  state.collapsed[f.workspace.value] = state.collapsed[f.workspace.value] || {};
  state.collapsed[f.workspace.value][f.priority.value] = false;
  if (f.workspace.value !== state.activeWs) state.activeWs = f.workspace.value;
  save(); render(); notify("已添加任务");
});

$("reset-link").addEventListener("click", (e) => { e.preventDefault(); if (confirm("恢复初始演示数据？")) { state = seed(); save(); render(); notify("演示数据已重置"); } });

render();
</script>
</body>
